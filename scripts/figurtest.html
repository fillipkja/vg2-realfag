<!doctype html>
<html lang="nb"><meta charset="utf-8">
<title>Figurtest — Realfag VG2</title>
<!-- Viser alle figurtypene med realistiske data, i lys og mørk modus.
     Kjøres med scripts/figurtest.sh for visuell verifisering. -->
<link rel="stylesheet" href="../vendor/katex/katex.min.css">
<script src="../vendor/katex/katex.min.js"></script>
<script src="../vendor/katex/contrib/mhchem.min.js"></script>
<script src="../figurer.js"></script>
<style id="egen">
  body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: var(--page, #fff);
         color: var(--text-primary, #000); }
  .kol { display: flex; align-items: flex-start; }
  .side { width: 393px; padding: 14px; box-sizing: border-box; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em;
       color: var(--text-muted); margin: 16px 0 4px; }
  .feil { background: #fee; color: #900; padding: 8px; border-radius: 6px;
          font: 12px/1.4 monospace; white-space: pre-wrap; }
  #status { position: fixed; right: 8px; top: 8px; z-index: 9;
            background: #000; color: #0f0; font: 12px monospace; padding: 6px 10px; border-radius: 6px; }
</style>
<!-- Stilen hentes fra index.html ved kjoring, saa testsiden aldri kan bli
     utdatert naar nye figurklasser legges til. -->
<script>
  document.write('<style id="appstil"></style>');
</script>
<body>
<div id="status">…</div>
<div class="kol"><div class="side" id="lys"></div></div>
<script type="module">
const appstil = document.getElementById("appstil");
{
  const idx = await (await fetch("../index.html")).text();
  const m = idx.match(/<style>([\s\S]*?)<\/style>/);
  appstil.textContent = m ? m[1] : "";
}

  ["kjemi", {

  ["biologi", {

    forklaring: "Negativ tilbakekopling: resultatet av responsen demper det som utløste den.",

  ["biologi", {

      { navn: "G1", note: "vekst og vanlig aktivitet" },
      { navn: "S", note: "DNA kopieres" },
      { navn: "G2", note: "forberedelse til deling" },

  ["biologi", {

    data: [
      { navn: "Produsenter", verdi: 20000 },
      { navn: "Førstehånds­forbrukere", verdi: 2000 },
      { navn: "Andrehånds­forbrukere", verdi: 200 },
      { navn: "Tredjehånds­forbrukere", verdi: 20 },
    ],
  }],

  ["biologi", {
    type: "hierarki", tittel: "Klassifisering av mennesket",
    forklaring: "Hvert nivå ligger inni det over: alle primater er pattedyr, alle pattedyr er ryggstrengdyr. Bare art og slekt skrives i artsnavnet.",
    nivaaer: [
      { navn: "Domene", eksempel: "Eukaryoter" },
      { navn: "Rike", eksempel: "Dyr" },
      { navn: "Rekke", eksempel: "Ryggstrengdyr" },
      { navn: "Klasse", eksempel: "Pattedyr" },
      { navn: "Orden", eksempel: "Primater" },
      { navn: "Slekt", eksempel: "Homo" },
      { navn: "Art", eksempel: "Homo sapiens" },
    ],
  }],
  ["kjemi", {
    type: "spektrum", tittel: "pH-skalaen", enhet: "pH", min: 0, max: 14,
    forklaring: "Hvert trinn på skalaen er en tidobling av konsentrasjonen av oksoniumioner. pH 3 er altså 10 000 ganger surere enn pH 7.",
    band: [
      { fra: 0, til: 3, navn: "sterkt surt", verdi: "magesyre" },
      { fra: 3, til: 6, navn: "surt", verdi: "regn" },
      { fra: 6, til: 8, navn: "nøytralt", verdi: "blod" },
      { fra: 8, til: 11, navn: "basisk", verdi: "såpe" },
      { fra: 11, til: 14, navn: "sterkt basisk", verdi: "lut" },
    ],
  }],
  ["kjemi", {
    type: "atom", tittel: "Natriumatomet", grunnstoff: "Na",
    forklaring: "Natrium har ett elektron i ytterste skall. Det er derfor det gir bort ett elektron og blir Na⁺ med edelgasstruktur.",
    protoner: 11, noytroner: 12, skall: [2, 8, 1], valens: 1,
    skallnavn: ["K", "L", "M"],
  }],
  ["kjemi", {
    type: "molekyl", tittel: "Vannmolekylet", sentral: "O",
    forklaring: "To ledige elektronpar på oksygen presser bindingene sammen, så vinkelen blir 104,5° og ikke 109,5°. Det gjør molekylet polart.",
    ligander: ["H", "H"], geometri: "vinklet", ledigePar: 2, vinkel: "104,5°",
  }],
  ["fysikk", {
    type: "krets", tittel: "To motstander i parallell",
    forklaring: "Begge grenene har full spenning over seg. Den med minst resistans trekker mest strøm.",
    kilde: { navn: "12 V" },
    grener: [[{ navn: "R₁", verdi: "4 Ω" }], [{ navn: "R₂", verdi: "6 Ω" }]],
    strom: "I = I₁ + I₂ = 3,0 A + 2,0 A = 5,0 A",
  }],
  ["fysikk", {
    type: "krets", tittel: "Tre motstander i serie",
    forklaring: "Samme strøm går gjennom alle tre. Spenningen deles i forhold til resistansen.",
    kilde: { navn: "9 V" },
    grener: [[{ navn: "R₁", verdi: "2 Ω" }, { navn: "R₂", verdi: "3 Ω" }, { navn: "R₃", verdi: "4 Ω" }]],
    strom: "I = 9 V / 9 Ω = 1,0 A",
  }],
  ["biologi", {
    type: "sammenlikning", tittel: "Prokaryot og eukaryot celle",
    forklaring: "Den viktigste forskjellen er cellekjernen. Alt det andre følger av at eukaryoter deler cellen inn i rom med egne oppgaver.",
    kolonner: ["Prokaryot", "Eukaryot"],
    rader: [
      { egenskap: "Arvestoff", venstre: "Fritt i cytoplasmaet, ett ringformet kromosom", hoyre: "Inne i cellekjernen, flere lineære kromosomer" },
      { egenskap: "Organeller", venstre: "Ingen membranomsluttede", hoyre: "Mitokondrier, ER, Golgi og flere" },
      { egenskap: "Størrelse", venstre: "1–5 µm", hoyre: "10–100 µm" },
      { egenskap: "Ribosomer", venstre: "70S", hoyre: "80S i cytoplasmaet" },
    ],
  }],
];

let feil = 0, antall = 0;
const q = new URLSearchParams(location.search).get("theme");
if (q === "dark" || q === "light") document.documentElement.dataset.theme = q;
for (const mal of ["lys"]) {
  const vert = document.getElementById(mal);
  vert.innerHTML = FIGURER.map(([fag, f]) => {
    let h = "";
    try { h = window.VG2Figur.figurHTML(f, fag); }
    catch (e) { h = `<div class="feil">KRASJ ${f.type}: ${e.message}</div>`; }
    if (!h) { h = `<div class="feil">TOM ${f.type} — figuren ble ikke tegnet</div>`; }
    if (mal === "lys") { antall++; if (h.includes("feil")) feil++; }
    return `<h2>${f.type} · ${fag}</h2>${h}`;
  }).join("");
}
document.getElementById("status").textContent =
  feil === 0 ? `FIGUR-OK ${antall} figurer` : `FIGUR-FEIL ${feil} av ${antall}`;
document.title = feil === 0 ? "FIGUR-OK" : "FIGUR-FEIL";
</script>
</body>
</html>
